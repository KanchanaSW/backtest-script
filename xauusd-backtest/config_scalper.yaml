# Pure Scalping Engine v3.1 — High-Performance M3 Scalper
# Chart timeframe: 3-minute (M3). Designed for XAUUSD on raw ECN / zero-spread.

data:
  instrument: xauusd
  price_type: bid
  date_from: "2015-01-01"
  date_to: now
  download_timeframes: ["m1"]
  chart_timeframe: "3min"
  timezone: "UTC"
  include_flats: true
  raw_dir: data/raw
  processed_dir: data/processed

broker:
  spread: 0.0
  slippage: 0.0
  commission_per_unit: 0.07
  margin_pct: 10.0

strategy:
  account_size: 5000.0
  lot_size: 0.1
  units_per_lot: 100.0

  # ── Micro-FVG Scalping Targets ──
  tp_pips: 5.0                    # Fast 5-pip scalp target
  sl_mode: "tighter"
  sl_atr_mult: 1.3                # 1.3 ATR breathing room prevents wick stop-outs
  sl_fixed_pips: 7.0              # Max dollar ceiling
  atr_length: 14
  min_body_pct: 45.0
  fvg_atr_min: 0.25
  entry_confirm: true
  max_wick_pct: 50.0

  # ── Early Break-Even & Loss Protection ──
  use_early_be: true              # Moves SL to entry + 0.5 once +2.25 pips reached
  be_trigger_pct: 45.0
  trail_be_offset: 0.5

  # ── Partial Scale-Out & Runner ──
  use_partial: true               # 60% at TP1, trail 40% runner
  scale_pct: 60
  tp2_atr_mult: 2.5
  use_trail_scalp: true
  trail_atr_mult: 0.6

  # ── HTF Trend Filter ──
  use_htf_trend: true
  htf_tf: "15"
  htf_ema_len: 50
  htf_trend_mode: "single"

  # ── LTF Momentum & Order-Flow ──
  use_ema_filter: true
  ema_fast_len: 8
  ema_slow_len: 21
  min_ema_spread: 0.0
  use_vol_spike: true
  vol_sma_len: 20
  vol_spike_mult: 1.1

  # ── RSI Exhaustion ──
  use_rsi_filter: true
  rsi_length: 14
  rsi_ob: 70.0
  rsi_os: 30.0

  # ── Optional Filters ──
  use_vwap_filter: false          # Disabled by default for higher trade frequency
  use_atr_floor: true
  atr_floor_mult: 0.4

  # ── Risk Limits & Circuit Breaker ──
  max_daily_losses: 3
  max_daily_trades: 15
  close_friday: true
  min_rr: 0.5
  use_cooldown: true
  cooldown_bars: 8

  # ── Session Filter ──
  use_session: false              # 24h active scalping across London & NY
  trading_hours: "0200-1600"
  session_tz: "America/New_York"

fixed:
  atr_length: 14
  chart_timezone: "UTC"

output:
  directory: results_scalper
